# Render Blueprint: เวอร์ชันเว็บของแอปมือถือ (mobile/) เป็น Static Site
# ใช้งาน: Render Dashboard → New + → Blueprint → เลือก repo นี้
services:
  - type: web
    runtime: static
    name: note-taeng-pleng
    branch: main
    buildCommand: cd mobile && npm ci && npx expo export --platform web
    staticPublishPath: ./mobile/dist
    # build ใหม่เฉพาะเมื่อไฟล์ในแอปมือถือเปลี่ยน
    buildFilter:
      paths:
        - mobile/**
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # ไฟล์ใน _expo/static มีชื่อตาม hash ของเนื้อหา เก็บ cache ได้นาน
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # แอปหน้าเดียว (Expo Router) ให้ทุก path ไปที่ index.html เช่นรีเฟรชหน้า /prompt
      - type: rewrite
        source: /*
        destination: /index.html
